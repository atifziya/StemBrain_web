<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/stembrain-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7f5" />
    <meta name="description" content="STEMBRAIN Web IDE — build and deploy robotics programs with Blockly." />
    <title>STEMBRAIN Web IDE</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("stembrain_web_ide_theme_v1");
        if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";
      } catch { /* Use the light theme when browser storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
